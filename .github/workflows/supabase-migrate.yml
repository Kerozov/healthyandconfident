name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrate.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Baseline pre-CI migrations
        run: |
          set -euo pipefail
          cat > /tmp/ensure_migrations_table.sql <<'SQL'
          CREATE SCHEMA IF NOT EXISTS supabase_migrations;

          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
            version text PRIMARY KEY,
            name text,
            statements text[]
          );
          SQL
          supabase db query --linked -f /tmp/ensure_migrations_table.sql

          {
            echo "INSERT INTO supabase_migrations.schema_migrations (version, name, statements)"
            echo "VALUES"
            first=true
            for f in supabase/migrations/[0-9]*_*.sql; do
              base=$(basename "$f" .sql)
              version="${base%%_*}"
              # Only migrations that predate this workflow were applied by hand:
              # 001-057 plus the four-digit 0132/0142 in-betweens. Everything from
              # 058 on must reach the database through `db push` — pre-recording a
              # new file here would mark it applied and silently skip it.
              case "$version" in
                0[0-4][0-9]|05[0-7]|0[0-9][0-9][0-9]) ;;
                *) continue ;;
              esac
              name="${base#*_}"
              if [ "$first" = true ]; then
                printf "  ('%s', '%s', ARRAY[]::text[])" "$version" "$name"
                first=false
              else
                printf ",\n  ('%s', '%s', ARRAY[]::text[])" "$version" "$name"
              fi
            done
            echo
            echo "ON CONFLICT (version) DO NOTHING;"
          } > /tmp/baseline.sql
          cat /tmp/baseline.sql
          supabase db query --linked -f /tmp/baseline.sql

      - name: Apply pending migrations
        run: supabase db push --yes

      # A migration that is recorded but never ran is invisible: the workflow
      # goes green while the schema is unchanged. Fail the push instead.
      - name: Verify every migration is applied
        run: |
          set -euo pipefail
          {
            echo "do \$\$"
            echo "declare missing text;"
            echo "begin"
            echo "  select string_agg(l.version, ', ' order by l.version) into missing"
            echo "  from (values"
            first=true
            for f in supabase/migrations/[0-9]*_*.sql; do
              base=$(basename "$f" .sql)
              version="${base%%_*}"
              if [ "$first" = true ]; then
                printf "    ('%s')" "$version"
                first=false
              else
                printf ",\n    ('%s')" "$version"
              fi
            done
            echo
            echo "  ) as l(version)"
            echo "  left join supabase_migrations.schema_migrations m on m.version = l.version"
            echo "  where m.version is null;"
            echo "  if missing is not null then"
            echo "    raise exception 'Migrations never reached the database: %', missing;"
            echo "  end if;"
            echo "end"
            echo "\$\$;"
          } > /tmp/verify.sql
          cat /tmp/verify.sql
          supabase db query --linked -f /tmp/verify.sql
